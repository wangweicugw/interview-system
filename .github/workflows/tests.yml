name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.lock
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check_public_release.py --strict
      - run: python scripts/demo_smoke.py --root "${{ runner.temp }}/interview-system-demo"

  ocr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr
      - run: python -m pip install -r requirements.lock
      - run: python -B -m unittest discover -s tests -p 'test_workflow.py' -k scanned_pdf
